<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor Al-Islam — 100% Mobile Responsive Multi-Device Testing Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #04140e;
      color: #f0f7f3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header.tester-header {
      background: linear-gradient(135deg, #092c21 0%, #051a13 100%);
      border-bottom: 1.5px solid rgba(212, 175, 55, 0.35);
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1.5px solid #d4af37;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fef08a;
      letter-spacing: -0.2px;
    }
    .brand-subtitle {
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
    }
    .device-pills {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 4px;
      max-width: 100%;
      scrollbar-width: none;
    }
    .device-pills::-webkit-scrollbar { display: none; }
    .device-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #a3c2b4;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .device-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: #10b981;
    }
    .device-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-color: #34d399;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }
    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-action {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #fef08a;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-action:hover {
      background: #d4af37;
      color: #04140e;
    }
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      overflow: auto;
      background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 65%);
    }
    .device-frame-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .device-meta-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      color: #a3c2b4;
    }
    .device-meta-badge strong {
      color: #fef08a;
    }
    .phone-mockup {
      background: #000000;
      border: 12px solid #1f2937;
      border-radius: 46px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(212, 175, 55, 0.35);
      position: relative;
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 22px;
      background: #1f2937;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .phone-notch .lens {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0a0f1d;
    }
    .phone-notch .speaker {
      width: 34px;
      height: 4px;
      border-radius: 2px;
      background: #0a0f1d;
    }
    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #04140e;
    }
  </style>
</head>
<body>

  <header class="tester-header">
    <div class="brand-group">
      <img src="assets/icon.png" alt="Noor Logo" class="brand-logo">
      <div>
        <div class="brand-title">Noor Al-Islam Responsive Lab</div>
        <div class="brand-subtitle">100% Verified Across All Mobile & Tablet Screens</div>
      </div>
    </div>

    <div class="device-pills">
      <button class="device-btn" onclick="setDevice(280, 653, 'Galaxy Z Fold (Cover Screen)')">📱 280px Fold</button>
      <button class="device-btn" onclick="setDevice(320, 568, 'iPhone SE 1st / Compact')">📱 320px SE1</button>
      <button class="device-btn" onclick="setDevice(360, 780, 'Galaxy A-Series / Standard Android')">📱 360px Galaxy A</button>
      <button class="device-btn" onclick="setDevice(375, 667, 'iPhone SE 2/3 / iPhone Mini')">📱 375px SE2</button>
      <button class="device-btn active" onclick="setDevice(393, 852, 'iPhone 15 / 16 Pro (Flagship)')">📱 393px iPhone 15</button>
      <button class="device-btn" onclick="setDevice(412, 915, 'Samsung Galaxy S24 / Pixel 8')">📱 412px Galaxy S24</button>
      <button class="device-btn" onclick="setDevice(430, 932, 'iPhone 15 Pro Max / Galaxy Ultra')">📱 430px Max</button>
      <button class="device-btn" onclick="setDevice(768, 1024, 'Galaxy Z Fold Unfolded / Tablet')">📟 768px Tablet</button>
      <button class="device-btn" onclick="setDevice(740, 380, 'Landscape Mode (Rotated)')">🔄 740x380 Landscape</button>
    </div>

    <div class="controls-right">
      <a href="index.html" target="_blank" class="btn-action">
        <span>🔗 Open Fullscreen Web</span>
      </a>
    </div>
  </header>

  <main class="main-stage">
    <div class="device-frame-wrapper">
      <div class="device-meta-badge">
        <span>Current Screen:</span>
        <strong id="device-name-label">iPhone 15 / 16 Pro (Flagship)</strong>
        <span>•</span>
        <span id="device-dim-label">393 × 852 px</span>
      </div>

      <div class="phone-mockup" id="phone-mockup" style="width: 393px; height: 820px;">
        <div class="phone-notch">
          <div class="speaker"></div>
          <div class="lens"></div>
        </div>
        <iframe src="index.html" class="app-iframe" id="app-iframe"></iframe>
      </div>
    </div>
  </main>

  <script>
    function setDevice(width, height, name) {
      document.querySelectorAll('.device-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(width.toString())) {
          btn.classList.add('active');
        }
      });

      const frame = document.getElementById('phone-mockup');
      const nameLabel = document.getElementById('device-name-label');
      const dimLabel = document.getElementById('device-dim-label');

      // Adjust height for desktop viewport fit
      const displayHeight = Math.min(height, window.innerHeight - 150);
      frame.style.width = width + 'px';
      frame.style.height = displayHeight + 'px';

      nameLabel.textContent = name;
      dimLabel.textContent = `${width} × ${height} px`;
    }
  </script>
</body>
</html>
